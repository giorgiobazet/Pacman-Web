<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pac-Man Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- By Giorgio Bazet -->
</head>
<body>
    <div id="game-container">
        <header>
            <div class="score">SCORE<br><span id="pontos" style="color: cyan;">0</span></div>
            <div class="title" style="color: yellow;">PAC-MAN</div>
            <div class="score">LEFT<br><span id="restantes" style="color: red;">0</span></div>
        </header>

        <canvas id="tabuleiro" width="900" height="340"></canvas>

        <div id="game-over" class="hidden">
            <h2 id="mensagem-fim">GAME OVER</h2>
            <button onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>

        <div id="mobile-controls">
            <div class="d-pad">
                <button id="btn-up" class="dir-btn">W</button>
                <div class="d-pad-middle">
                    <button id="btn-left" class="dir-btn">A</button>
                    <button id="btn-right" class="dir-btn">D</button>
                </div>
                <button id="btn-down" class="dir-btn">S</button>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
